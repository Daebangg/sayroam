springdoc.api-docs.enabled=true
# 기동 내부 정보는 줄이고, 앱·요청 결과와 프레임워크 경고를 중심으로 본다.
logging.level.root=WARN
logging.level.com.daebangg.sayroam=INFO
spring.main.banner-mode=off
spring.main.log-startup-info=false
app.logging.startup.enabled=true
app.logging.startup.timeout-ms=3000
# Gradle·IDE 콘솔에서도 색을 표시한다. 리다이렉트 등에서 필요하면 환경변수로 never로 바꾼다.
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){magenta} - %msg %kvp%n%ex
logging.pattern.request-console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%level) %httpRequest%n
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.persist-authorization=false
# 같은 출처의 XSRF-TOKEN 쿠키를 요청 헤더에 자동 전달한다.
springdoc.swagger-ui.csrf.enabled=true
# HTTP 로컬 개발 전용. 운영 기본값은 Secure=true다.
app.auth.refresh-cookie.secure=false
app.auth.social.browser-cookie.secure=false
# IDE/bootRun도 통합 빌드 결과를 제공한다. 작업 디렉터리는 backend/다.
# JAR에 포함된 자원이 있으면 먼저 사용하고, 클래스 실행에서는 생성 디렉터리를 읽는다.
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./build/generated/frontend/
# 재빌드로 삭제된 파일의 Resource 참조를 캐시하면 404 대신 FileNotFoundException(500)이 발생한다.
spring.web.resources.chain.cache=false
