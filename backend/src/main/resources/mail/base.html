<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>SayRoam</title>
  <style>
    @media only screen and (max-width: 600px) {
      .outer { padding: 12px 8px !important; }
      .content { padding: 26px 22px !important; }
      .heading { font-size: 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#edf2fc;color:#17396d;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#edf2fc">
    <tr><td class="outer" align="center" style="padding:32px 16px;">
      <!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border-radius:20px;overflow:hidden;">
        <tr><td bgcolor="#f8faff" style="padding:23px 30px;">
          <img src="cid:sayroam-logo" width="184" height="43" alt="SayRoam" style="display:block;width:184px;max-width:100%;height:auto;border:0;color:#17396d;font-size:24px;font-weight:700;">
        </td></tr>
        <tr><td bgcolor="#dce9fc" style="font-size:0;line-height:0;">
          <img src="cid:sayroam-travel" width="600" height="200" alt="" role="presentation" style="display:block;width:100%;max-width:600px;height:auto;border:0;">
        </td></tr>
        <tr><td class="content" style="padding:32px;">
          <p style="margin:0 0 10px;color:#4b6cb2;font-size:11px;font-weight:700;letter-spacing:1.5px;line-height:1.5;">{{category}}</p>
          <h1 class="heading" style="margin:0 0 16px;color:#17396d;font-size:28px;line-height:1.4;letter-spacing:-0.8px;">{{title}}</h1>
          <p style="margin:0 0 18px;color:#526584;font-size:14px;line-height:1.8;">{{introduction}}</p>
          {{details}}
          {{highlight}}
          {{action}}
          <p style="margin:0;padding:16px 18px;background:#fff6e7;border-radius:12px;color:#695338;font-size:12px;line-height:1.8;">{{notice}}</p>
        </td></tr>
        <tr><td bgcolor="#f8faff" style="padding:22px 30px;">
          <p style="margin:0 0 6px;color:#385caa;font-size:12px;font-weight:700;line-height:1.6;">{{tagline}}</p>
          <p style="margin:0;color:#657899;font-size:11px;line-height:1.7;">{{automatic}}</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
