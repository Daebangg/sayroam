spring.application.name=sayroam

# local은 텍스트 콘솔, 그 외 환경은 Boot 내장 JSON 콘솔. 보관은 실행 환경의 수집기가 담당한다.
logging.level.root=INFO
logging.level.com.daebangg.sayroam=INFO
logging.structured.format.console=logstash
# JDBC 오류·경고 원문에는 중복된 이메일 등 DB 값이 포함될 수 있다. 앱의 안전한 실패 로그로 확인한다.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
app.logging.http.slow-request-ms=1000
# 메시지 브로커의 Executor 빈이 있어도 MDC decorator를 사용하는 MVC 기본 실행기를 준비한다.
spring.task.execution.mode=force

# 스키마 변경은 Gradle flywayMigrate로만 실행한다. 앱은 매핑을 검증한다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# 검증 메시지 등 로케일 의존 메시지를 요청의 Accept-Language와 무관하게 영어로 고정
spring.web.locale=en
spring.web.locale-resolver=fixed

# API documentation is enabled only in the local profile by default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# @Nullable 객체 참조를 OpenAPI 3.1의 oneOf(참조, null)로 생성한다.
springdoc.model-converters.java-nullable-property-customizer.enabled=true

# StringRedisTemplate을 사용하며 Redis Repository는 사용하지 않는다.
spring.data.redis.repositories.enabled=false
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# 공급자 자격 정보가 없는 환경은 기존 인증만 사용한다. 활성화 시 개인 설정이 필요하다.
app.auth.social.google.enabled=false
app.auth.social.kakao.enabled=false
app.auth.social.naver.enabled=false

# 한국관광공사 TourAPI 장소 검색. 서비스 키가 없는 환경은 검색을 끄고, 키는 개인 설정이나 환경변수로 넣는다.
app.place.tour-api.enabled=false

# SMTP timeout 단위는 밀리초다. 기본적으로 시작 시 연결 검사를 끄며 외부 설정으로 재정의한다.
app.mail.enabled=false
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# 모집 변경은 커밋 이후 이벤트로 처리하며, 누락·실패 작업은 주기적으로 복구한다.
app.companion.matching.enabled=true
app.companion.matching.recovery-delay-ms=30000
